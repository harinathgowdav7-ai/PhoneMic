name: Build and Upload Release Installers

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract Source Archive
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -o "$z"; done
          if [ -d PhoneMic/android ]; then cp -rn PhoneMic/* . || true; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Build Android APK and Upload to v1.0.0 Release
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          sed -i 's/compileSdk = 35/compileSdk = 34/g; s/targetSdk = 35/targetSdk = 34/g' android/app/build.gradle.kts
          sed -i 's/private val streamClient =/private val streamClient: AudioStreamClient =/g; s/private val audioCaptureEngine =/private val audioCaptureEngine: AudioCaptureEngine =/g' android/app/src/main/java/com/phonemic/app/viewmodel/PhoneMicViewModel.kt
          cd android
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../PhoneMic-v1.0.0.apk
          cd ..
          gh release upload v1.0.0 PhoneMic-v1.0.0.apk --clobber

  build-windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract Source Archive
        shell: pwsh
        run: |
          Get-ChildItem *.zip | ForEach-Object { Expand-Archive -Path $_.FullName -DestinationPath . -Force }
          if (Test-Path PhoneMic/windows) { Copy-Item -Path PhoneMic/* -Destination . -Recurse -Force }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Windows Installer and Upload to v1.0.0 Release
        shell: pwsh
        run: |
          dotnet publish windows/PhoneMic.Desktop/PhoneMic.Desktop.csproj -c Release -r win-x64 --self-contained true
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows/Installer/PhoneMicSetup.iss
          gh release upload v1.0.0 windows/dist/PhoneMic-Windows-Setup-v1.0.0.exe --clobber
